name: Playwright

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'playwright/**'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - '.github/workflows/playwright.yml'
  workflow_dispatch:

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: ${{ matrix.jobName }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            jobName: E2E (Playwright, chromium)
            workers: 2
            shardIndex: 1
            shardTotal: 1
          - browser: webkit
            jobName: E2E (Playwright, webkit, shard 1/4)
            workers: 1
            shardIndex: 1
            shardTotal: 4
          - browser: webkit
            jobName: E2E (Playwright, webkit, shard 2/4)
            workers: 1
            shardIndex: 2
            shardTotal: 4
          - browser: webkit
            jobName: E2E (Playwright, webkit, shard 3/4)
            workers: 1
            shardIndex: 3
            shardTotal: 4
          - browser: webkit
            jobName: E2E (Playwright, webkit, shard 4/4)
            workers: 1
            shardIndex: 4
            shardTotal: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Detect Playwright-impacting changes
        id: changes
        uses: dorny/paths-filter@v4.0.2
        with:
          filters: |
            playwright:
              - 'src/**'
              - 'playwright/**'
              - 'package-lock.json'
              - 'playwright.config.ts'
              - '.github/workflows/playwright.yml'

      - name: Setup Node
        if: ${{ steps.changes.outputs.playwright == 'true' }}
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24.14.0'
          cache: npm

      - name: Install Dependencies
        if: ${{ steps.changes.outputs.playwright == 'true' }}
        run: npm ci

      - name: Check Types
        if: ${{ steps.changes.outputs.playwright == 'true' }}
        run: npm run check-types

      - name: Cache Playwright Browsers
        if: ${{ steps.changes.outputs.playwright == 'true' }}
        uses: actions/cache@v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ matrix.browser }}-

      - name: Install Browsers
        if: ${{ steps.changes.outputs.playwright == 'true' }}
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run Playwright Tests
        if: ${{ steps.changes.outputs.playwright == 'true' }}
        env:
          CI: 'true'
        run: |
          SHARD_ARGS=''
          if [ '${{ matrix.shardTotal }}' != '1' ]; then
            SHARD_ARGS="--shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}"
          fi
          npm run test:e2e -- --project=${{ matrix.browser }} --workers=${{ matrix.workers }} $SHARD_ARGS

      - name: Upload Playwright report
        if: ${{ failure() && steps.changes.outputs.playwright == 'true' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.shardIndex }}of${{ matrix.shardTotal }}
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: ${{ failure() && steps.changes.outputs.playwright == 'true' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-results-${{ matrix.browser }}-${{ matrix.shardIndex }}of${{ matrix.shardTotal }}
          path: test-results
          if-no-files-found: ignore

      - name: Skip Playwright for unrelated changes
        if: ${{ steps.changes.outputs.playwright != 'true' }}
        run: echo 'No Playwright-impacting files changed; marking required check as successful.'
